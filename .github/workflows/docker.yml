name: Docker image

# Multi-arch (amd64 + arm64) build of packages/server → Docker Hub.
# Needs repo secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
# (Docker Hub → Account settings → Personal access tokens, Read & Write).
on:
  push:
    tags: ["server-v*"]
  workflow_dispatch:

env:
  IMAGE: maskin25/captions.js-render

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read server version
        id: version
        run: echo "version=$(node -p "require('./packages/server/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: "captions.js (captionsjs) — burn animated word-level captions/subtitles into video with FFmpeg"
          readme-filepath: packages/server/README.md
