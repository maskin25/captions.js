name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: |
          pnpm --filter captions.js build
          pnpm --filter @captionsjs/server build
          pnpm --filter @captionsjs/react build
      - name: Typecheck configurator
        run: pnpm --filter @maskin25/captions-configurator exec tsc --noEmit -p .
      - name: Test core (exports/types under every moduleResolution)
        run: pnpm --filter captions.js test
      - name: Test server (animations, CLI end-to-end, golden frames)
        run: pnpm --filter @captionsjs/server test
      - name: Test React (server import, then the Vite and Next.js examples in Chromium)
        run: |
          pnpm --filter @captionsjs/react test
          pnpm --filter @captionsjs/react exec playwright install chromium
          pnpm --filter example-react-vite test
          pnpm --filter example-react-next test
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Playwright 1.56 has no build for the runner's Ubuntu 26.04; the 24.04 one runs
          PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
      - name: Upload golden-frame diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diff-node${{ matrix.node }}
          path: packages/server/test/golden-out/
          if-no-files-found: ignore
