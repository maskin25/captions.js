# Publishes only the redirect stub (index.html + 404.html) to the gh-pages branch, wiping
# the old demo/docs/presets, so every old URL forwards to the same path on captionsjs.dev.
name: GitHub Pages redirect + notify captionsjs.dev

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redirect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p gh-pages-dist && cp .github/pages-redirect/index.html .github/pages-redirect/404.html gh-pages-dist/ && touch gh-pages-dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: gh-pages-dist
          force_orphan: true

  # Rebuilds captionsjs.dev so docs, API reference and changelog follow main.
  # SITE_DISPATCH_TOKEN: fine-grained PAT with "Contents: read and write" on maskin25/captionsjs-site.
  # Skipped until the secret exists, so the redirect deploys either way.
  notify-site:
    runs-on: ubuntu-latest
    env:
      SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
    steps:
      - if: env.SITE_DISPATCH_TOKEN != ''
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.SITE_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/maskin25/captionsjs-site/dispatches \
            -d '{"event_type":"captionsjs-updated","client_payload":{"sha":"${{ github.sha }}"}}'
